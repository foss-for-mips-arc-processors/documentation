site_name: embARC Documentation Site for ARC Classic and ARC-V
repo_url: https://github.com/foss-for-mips-arc-processors/toolchain
repo_name: GNU ARC Toolchain
copyright: Copyright &copy; 2016 - 2026 MIPS Holding, Inc
theme:
  name: material
  highlightjs: true
  locale: en
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    primary: deep purple
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    # Use this option to integrate the local table of content
    # in the side bar:
    # - toc.integrate
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
plugins:
  - table-reader
  - search
  - autorefs
extra:
  version:
    provider: mike
extra_css:
  - css/extra.css
markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - def_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
nav:
  - Home:
    - index.md
    - home/release.md
    - home/processors.md
  - Toolchain:
    - toolchain/index.md
    - toolchain/building-toolchains.md
    - ARC-V:
      - toolchain/arc-v/getting-started-picolibc.md
      - toolchain/arc-v/getting-started-newlib.md
      - toolchain/arc-v/running-on-nsim.md
      - toolchain/arc-v/running-on-qemu.md
      - toolchain/arc-v/multilib.md
      - toolchain/arc-v/testing.md
    - ARC Classic:
      - toolchain/arc-classic/getting-started-nsim.md
      - toolchain/arc-classic/getting-started-qemu.md
      - toolchain/arc-classic/getting-started-picolibc.md
      - toolchain/arc-classic/arcv3.md
      - toolchain/arc-classic/arcv2.md
      - toolchain/arc-classic/arcompact.md
      - toolchain/arc-classic/memory.md
      - toolchain/arc-classic/faq.md
      - Advanced Topics:
        - toolchain/arc-classic/advanced/optimizations.md
        - toolchain/arc-classic/advanced/custom-instructions.md
        - toolchain/arc-classic/advanced/apex-header.md
        - toolchain/arc-classic/advanced/intrinsics.md
        - toolchain/arc-classic/advanced/sanitizers.md
        - toolchain/arc-classic/advanced/jli.md
        - toolchain/arc-classic/advanced/secure-shield.md
        - toolchain/arc-classic/advanced/small-data.md
        - toolchain/arc-classic/advanced/64-bit-operations.md
        - toolchain/arc-classic/advanced/interrupts.md
        - toolchain/arc-classic/advanced/tcf.md
